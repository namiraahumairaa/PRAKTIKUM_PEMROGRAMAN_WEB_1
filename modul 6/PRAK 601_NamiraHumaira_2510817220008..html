  <style>
    header {
      position: relative;
    }
    .header-corners div {
      position: absolute;
      width: 100px;
      height: 100px;
      background-color: transparent;
      border-color: black;
      border-style: solid;
    }
    .header-corners .top-left {
      border-width: 15px 0 0 15px;
      top: 0;
      left: 0;
    }
    .header-corners .top-right {
      border-width: 15px 15px 0 0;
      top: 0;
      right: 0;
    }
    .navbar {
      height: 150px;
    }
    .fontstyle1 {
      font-family: 'Times New Roman', cursive;
    }
    .img-container {
      padding: 20px 0;
    }
    .img-container img {
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }
    .height1 {
      height: 300px;
    }
    .footer {
      height: 300px;
      margin-top: 200px;
      position: relative;
    }
    .footer-corners div {
      position: absolute;
      width: 100px;
      height: 100px;
      background-color: transparent;
      border-color: black;
      border-style: solid;
    }
    .footer-corners .bottom-left {
      border-width: 0 0 15px 15px;
      bottom: 0;
      left: 4px;
    }
    .footer-corners .bottom-right {
      border-width: 0 15px 15px 0;
      bottom: 0;
      right: 10px;
    }
  </style>
</head>
