  <script>
    function setActiveNav(element) {
      const navLinks = document.querySelectorAll('.nav-menu');
      
      navLinks.forEach(link => {
        link.classList.remove('border', 'text-dark');
        link.style.color = '#919599';
      });

      element.classList.add('border', 'text-dark');
      element.style.color = '';
    }

    function filterSelection(category) {
      const items = document.querySelectorAll('.filter-item');
      const buttons = document.querySelectorAll('.btn-custom');
      const portfolioContainer = document.getElementById('portfolio');
      
      portfolioContainer.setAttribute('data-view', category.toLowerCase());
      
      buttons.forEach(btn => {
        if(btn.innerText.toLowerCase() === category || (category === 'all' && btn.innerText.toLowerCase() === 'all')) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      items.forEach(item => {
        if (category === 'all') {
          if (item.classList.contains('truz-photo')) {
            item.style.display = 'none';
          } else {
            item.style.display = 'block';
          }
        } else {
          if (item.classList.contains(category)) {
            item.style.display = 'block';
          } else {
            item.style.display = 'none';
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      filterSelection('all');
    });
  </script>
